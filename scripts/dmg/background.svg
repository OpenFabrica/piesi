<!-- DMG 窗口背景（640×400 点）。图标中心：Piesi.app (160,180)、Applications (480,180)，见 dmg-settings.py。
     改完用 scripts/dmg/render-background.sh 重新生成 background.tiff（1x + 2x）。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBF5"/>
      <stop offset="1" stop-color="#FFF1E0"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB340"/>
      <stop offset="1" stop-color="#FF8A00"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <!-- 底部一道很淡的弧，压住画面不显空 -->
  <path d="M-20 400 Q320 300 660 400 Z" fill="#FFE6C7" opacity="0.55"/>
  <!-- 箭头：从 app 指向「应用程序」，微微上拱 -->
  <path d="M262 178 Q320 150 372 172" fill="none" stroke="url(#arrow)" stroke-width="7" stroke-linecap="round"/>
  <path d="M356 154 L380 175 L350 186" fill="none" stroke="#FF8A00" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="PingFang SC, Helvetica Neue, sans-serif" text-anchor="middle">
    <text x="320" y="62" font-size="24" font-weight="700" fill="#3D2E1F">Piesi</text>
    <text x="320" y="86" font-size="12" fill="#8C7A66">干净压缩 · 中文不乱码 · Clean archives, readable names</text>
    <text x="320" y="318" font-size="15" font-weight="600" fill="#5C4A36">把 Piesi 拖到 Applications 文件夹即可安装</text>
    <text x="320" y="341" font-size="12" fill="#8C7A66">Drag Piesi to the Applications folder to install</text>
  </g>
</svg>
