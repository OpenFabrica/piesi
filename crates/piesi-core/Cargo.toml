[package]
name = "piesi-core"
description = "Piesi 压缩/解压引擎：格式驱动、编码识别、安全解压、压缩计划"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
zip.workspace = true
sevenz-rust2.workspace = true
unrar_sys.workspace = true
tar.workspace = true
flate2.workspace = true
bzip2.workspace = true
liblzma.workspace = true
zstd.workspace = true
deflate64.workspace = true
ppmd-rust.workspace = true
crc32fast.workspace = true
aes.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
sha1.workspace = true
encoding_rs.workspace = true
chardetng.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
cap-std.workspace = true
xattr.workspace = true
libc.workspace = true
memmap2.workspace = true
rayon.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[features]
default = ["sevenz-liblzma"]
# 7z 的 LZMA2 编解码走 liblzma（vendor/sevenz-rust2 的补丁）；关掉就退回 lzma-rust2 的纯 Rust 实现
sevenz-liblzma = ["sevenz-rust2/liblzma"]
# 纯 Rust LZMA 备胎（P0 基准用），默认走 liblzma
lzma-pure = []

[dev-dependencies]
anyhow.workspace = true
