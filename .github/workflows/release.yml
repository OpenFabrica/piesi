# 发版：推 v* 标签 → 通用二进制 → Developer ID 签名 → 公证 + staple → DMG 传到 GitHub Release。
# 门禁与打包逻辑都在 scripts/package.sh（RELEASE=1），这里只负责准备证书、密钥和上传。
# 需要在仓库 Settings → Secrets 里配这些（值不进仓库）：
#   DEVELOPER_ID_P12_BASE64    Developer ID Application 证书（含私钥）导出的 .p12，base64 一行
#   DEVELOPER_ID_P12_PASSWORD  .p12 的密码
#   APPSTORE_API_KEY_P8        App Store Connect API Key 的 .p8 文件内容
#   APPSTORE_API_KEY_ID        Key ID
#   APPSTORE_API_ISSUER        Issuer ID
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # 门禁要查标签是否在 main 上，需要完整历史
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 导入签名证书到临时钥匙串
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/piesi.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # 让 codesign 不弹框就能用私钥
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" || { echo "钥匙串里没有 Developer ID 证书" >&2; exit 1; }

      - name: 写入公证 API Key
        env:
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: 打包（门禁 → 构建 → 签名 → 公证 → staple）
        env:
          RELEASE: "1"
          APPLE_NOTARY_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPSTORE_API_ISSUER }}
        run: scripts/package.sh

      - name: 从 CHANGELOG.md 取本版说明
        run: |
          # 取顶部第一个「## 」小节到下一个「## 」之前；没有就留空
          awk 'BEGIN{n=0} /^## /{n++} n==1{print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md" || true
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "见 CHANGELOG.md" > "$RUNNER_TEMP/notes.md"

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          body_path: ${{ runner.temp }}/notes.md
          # 标签带 alpha / beta / rc 这类后缀的标成预发布
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: 清理钥匙串与密钥
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/piesi.keychain-db" 2>/dev/null || true
